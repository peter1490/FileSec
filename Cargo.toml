# FileSec workspace — a native, offline secure file-exchange app.
#
# Crates:
#   - filesec-core: pure crypto + on-disk `.fsec` container format. No GUI. The
#     unit/fuzz/audit target where the entire security story lives.
#   - filesec-gui:  thin egui/eframe presentation layer over filesec-core. Ships
#     the classical `filesec` binary.
#   - filesec-pqc:  the same GUI compiled with the post-quantum suites, shipping
#     the `filesec-pqc` binary. It is NOT a default member, so the bare
#     `cargo build`/`cargo test`/`cargo clippy` commands stay on the classical,
#     dependency-light path (no feature unification dragging PQC/keychain deps
#     into the default build). Build it explicitly with `-p filesec-pqc`.
[workspace]
resolver = "2"
members = ["crates/filesec-core", "crates/filesec-gui", "crates/filesec-pqc"]
default-members = ["crates/filesec-core", "crates/filesec-gui"]
# `fuzz/` is a detached cargo-fuzz crate (its own workspace + Cargo.lock). It is
# nightly-only (libfuzzer-sys) and must never be pulled into the MSRV-1.86 stable
# build, the locked default build, or the cargo-deny/audit supply-chain scan.
exclude = ["fuzz"]

[workspace.package]
# Single source of truth for the released version. `packaging/release-vars.sh`
# reads it back out of `cargo metadata` and the release workflow refuses to build
# a `v*` tag that disagrees with it, so this and the git tag can never drift.
# Bump it with `scripts/bump-version.sh <version>`, never by hand.
version = "0.4.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["FileSec contributors"]
rust-version = "1.86"
repository = "https://github.com/peter1490/FileSec"

# Release profile tuned for a small, fast single binary per OS.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Profile cargo-dist builds under (`dist build` / `dist plan`). Inherits the
# tuned release profile above.
[profile.dist]
inherits = "release"

# ---------------------------------------------------------------------------
# cargo-dist (the `dist` tool) — cross-platform archives + curl-pipe installers
# + a Windows MSI, with published SHA-256 checksums. This is the "cargo-dist"
# half of Phase 6 packaging; the authoritative pipeline that also produces the
# native .dmg / .deb / NSIS installers and does code signing + notarization is
# .github/workflows/release.yml (cargo-dist does not emit those formats). Run
# `dist init` to (re)generate dist's own CI if you want the hosted installers.
# See RELEASE.md.
# ---------------------------------------------------------------------------
[workspace.metadata.dist]
# Pin the dist CLI version for reproducible installer output.
cargo-dist-version = "0.28.0"
ci = "github"
installers = ["shell", "powershell", "msi"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
# One cargo invocation per package, so the post-quantum features of filesec-pqc
# are never unified into the classical `filesec` binary.
precise-builds = true
# Publish SHA-256 checksums next to every artifact.
checksum = "sha256"
install-updater = false
