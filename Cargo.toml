# FileSec workspace — a native, offline secure file-exchange app.
#
# Two crates:
#   - filesec-core: pure crypto + on-disk `.fsec` container format. No GUI. The
#     unit/fuzz/audit target where the entire security story lives.
#   - filesec-gui:  thin egui/eframe presentation layer over filesec-core.
[workspace]
resolver = "2"
members = ["crates/filesec-core", "crates/filesec-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["FileSec contributors"]
rust-version = "1.86"

# Release profile tuned for a small, fast single binary per OS.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
