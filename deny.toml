# cargo-deny configuration — FileSec's supply-chain gate.
#
# Enforced in CI by the "supply-chain" job in .github/workflows/ci.yml, using the
# pinned cargo-deny version. Run locally with:
#
#     cargo deny check
#
# FileSec keeps its security core dependency-light and MSRV-pinned (see the root
# Cargo.toml); the GUI's graph is dominated by the GPUI toolkit. This policy fails the build on known security advisories, on any
# license outside the permissive allow-list, and on a dependency pulled from
# anywhere other than crates.io.

[graph]
# Gate the platforms we actually ship binaries for. A crate that only exists for
# some other target should not gate our releases.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
# Evaluate feature-gated dependencies too (pqc, net, keyring, passkey), so the
# gate covers every crate a shipped build can pull in — not just the default one.
all-features = true

[advisories]
# RustSec advisory database. Any active vulnerability fails the check; yanked
# crates fail as well. Every entry in `ignore` must be a specific advisory ID
# with a justification: the reachability analysis, why the fix cannot be applied
# under our constraints, and the condition that lets us drop the exception. A new
# advisory (any ID not listed here) still fails the build — the gate stays live.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Each exception names an owner and a review-by date (at most a year out).
# scripts/check_advisory_exceptions.py fails CI once a date passes or the list
# drifts from .cargo/audit.toml, so an exception cannot silently become
# permanent; docs/DEPENDENCIES.md tracks them and the upgrade plan that retires
# them. CI also publishes an *unsuppressed* scan, so a green gate is never read
# as "no known advisories".
ignore = [
    # All accepted advisories below live in the UI toolkit's graph (GPUI and GPUI
    # Kit, pinned together as `gpui-kit = "=0.10.0"`). None of them is on a path
    # that parses a vault, a `.fsec` container, a public key, or network input.

    # ttf-parser 0.25.1 — unmaintained (no vulnerability, no patch exists).
    # Reached through GPUI's Linux text stack (cosmic-text -> fontdb) and its SVG
    # icon renderer (usvg). It parses the bundled Inter/Phosphor faces and the
    # system's installed fonts — never a font from a vault or a peer. Drop when
    # GPUI's text and SVG stacks move to skrifa/read-fonts.
    { id = "RUSTSEC-2026-0192", reason = "owner: @peter1490; review-by: 2027-05-31; unmaintained ttf-parser via GPUI's Linux text stack and usvg (bundled/system fonts only); drop when GPUI moves to skrifa (docs/DEPENDENCIES.md)" },

    # quick-xml 0.39.4 — two DoS advisories, patched only in >= 0.41.0 (major).
    # In this graph 0.39.4 is used only by `wayland-scanner`, a *proc-macro* that
    # parses the Wayland protocol XML shipped inside the wayland-protocols crates
    # at compile time; nothing parses XML with it at run time (accesskit's AT-SPI
    # stack already uses the patched 0.41). Drop when wayland-scanner moves to
    # quick-xml >= 0.41.
    { id = "RUSTSEC-2026-0194", reason = "owner: @peter1490; review-by: 2027-05-31; quick-xml DoS, build-time only (wayland-scanner proc-macro parsing bundled protocol XML); drop with wayland-scanner on quick-xml >= 0.41" },
    { id = "RUSTSEC-2026-0195", reason = "owner: @peter1490; review-by: 2027-05-31; quick-xml DoS, build-time only (wayland-scanner proc-macro parsing bundled protocol XML); drop with wayland-scanner on quick-xml >= 0.41" },

    # Upstream merged these standalone crates into zbus 6. These are
    # maintenance-only notices, with no patched standalone releases or reported
    # vulnerability. GPUI's Linux D-Bus users (the accesskit AT-SPI bridge, the
    # desktop portal, notifications, the Secret Service client) still require
    # the zbus 5 APIs; a forced major-version override would break them. These
    # are desktop D-Bus dependencies, not FileSec's container or peer protocol
    # parsers. Retire these entries when those crates migrate to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "owner: @peter1490; review-by: 2027-05-31; zvariant maintenance-only notice after merger into zbus 6; GPUI's Linux D-Bus stack requires zbus 5; drop with the zbus 6 migration (docs/DEPENDENCIES.md)" },
    { id = "RUSTSEC-2026-0371", reason = "owner: @peter1490; review-by: 2027-05-31; zbus_names maintenance-only notice after merger into zbus 6; GPUI's Linux D-Bus stack requires zbus 5; drop with the zbus 6 migration" },
    { id = "RUSTSEC-2026-0372", reason = "owner: @peter1490; review-by: 2027-05-31; zvariant_derive maintenance-only notice after merger into zbus 6; GPUI's Linux D-Bus stack requires zbus 5; drop with the zbus 6 migration" },

    # instant 0.1.13 — unmaintained (no vulnerability). A tiny `Instant` shim
    # GPUI Base uses for animation timing; no input parsing at all. Drop when
    # GPUI Kit replaces it (e.g. with web-time).
    { id = "RUSTSEC-2024-0384", reason = "owner: @peter1490; review-by: 2027-05-31; unmaintained instant timing shim in GPUI Base (no input parsing); drop when GPUI Kit replaces it" },

    # paste 1.0.15 — unmaintained compile-time proc-macro (no vulnerability),
    # used by GPUI Component's code generation. Nothing of it is in the binary.
    # Drop when GPUI Component replaces it (e.g. with pastey).
    { id = "RUSTSEC-2024-0436", reason = "owner: @peter1490; review-by: 2027-05-31; unmaintained paste proc-macro, compile time only (GPUI Component); drop when GPUI Component replaces it" },

    # rustybuzz 0.20.1 — unmaintained (no vulnerability). Text shaping inside
    # usvg, which GPUI uses to render its own SVG icon assets (compiled in, never
    # user content: FileSec does not preview files). Drop when GPUI's usvg moves
    # to harfrust.
    { id = "RUSTSEC-2026-0206", reason = "owner: @peter1490; review-by: 2027-05-31; unmaintained rustybuzz inside usvg rendering GPUI's bundled SVG icons (no user content); drop when usvg moves to harfrust" },
]

[licenses]
# Every license that appears as a required term anywhere in the current
# dependency graph. Permissive-only. Unicode-3.0 is the ICU normalization
# tables; MPL-2.0 covers option-ext (via the directories crate); 0BSD is
# enum-iterator (via GPUI Component). Adding a crate whose license is not listed
# here is intentionally a build failure — vet it and add it explicitly. (The
# embedded Inter/Phosphor fonts are assets, not crates; their OFL-1.1 and MIT
# texts ship in THIRD_PARTY_NOTICES.txt and the About page.)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
# Duplicate transitive versions are a hygiene signal, not a hard failure, in a
# crypto + GUI tree that legitimately carries a few pinned transitive versions.
multiple-versions = "warn"
# A `version = "*"` dependency is never acceptable for a crates.io dependency in
# a security-sensitive build. Internal workspace crates are pulled by `path` (no
# version, which cargo treats as `*`) and are exempt.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies, no alternate registries. The vendored
# NAT-PMP and hidapi code lives in-tree, so this must stay empty of git sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
