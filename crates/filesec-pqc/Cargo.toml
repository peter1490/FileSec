[package]
name = "filesec-pqc"
description = "FileSec desktop app — post-quantum build (hybrid ML-KEM/ML-DSA suites enabled)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "filesec-pqc"
path = "src/main.rs"

# `cargo deb` (Linux .deb) for the post-quantum build. Built with `--no-build`
# after the release workflow compiles `target/release/filesec-pqc`.
[package.metadata.deb]
maintainer = "FileSec contributors"
copyright = "FileSec contributors"
extended-description = """\
FileSec is a native, offline desktop app for securely exchanging files between \
parties using public/private-key cryptography. This is the post-quantum build: \
new identities are hybrid (X25519+ML-KEM-768 / Ed25519+ML-DSA-65) and the local \
store is encrypted at rest under the hybrid suite. It installs alongside the \
classical `filesec` package."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/filesec-pqc", "usr/bin/", "755"],
    ["packaging/filesec-pqc.desktop", "usr/share/applications/", "644"],
    # Icons live in the filesec-gui crate; install them under the pqc name so the
    # .desktop's `Icon=filesec-pqc` resolves in app menus.
    ["../filesec-gui/assets/icon/icon-16.png", "usr/share/icons/hicolor/16x16/apps/filesec-pqc.png", "644"],
    ["../filesec-gui/assets/icon/icon-32.png", "usr/share/icons/hicolor/32x32/apps/filesec-pqc.png", "644"],
    ["../filesec-gui/assets/icon/icon-64.png", "usr/share/icons/hicolor/64x64/apps/filesec-pqc.png", "644"],
    ["../filesec-gui/assets/icon/icon-128.png", "usr/share/icons/hicolor/128x128/apps/filesec-pqc.png", "644"],
    ["../filesec-gui/assets/icon/icon-256.png", "usr/share/icons/hicolor/256x256/apps/filesec-pqc.png", "644"],
    ["../filesec-gui/assets/icon/icon-512.png", "usr/share/icons/hicolor/512x512/apps/filesec-pqc.png", "644"],
]

[dependencies]
# The post-quantum variant is the same GUI compiled with the hybrid PQC suites
# (and OS-keychain auto-unlock) turned on. Keeping it in its own package means a
# per-package build — what the release workflow and cargo-dist's `precise-builds`
# do — compiles these features into THIS binary only, never into the classical
# `filesec` binary in filesec-gui. (A whole-workspace `cargo build --workspace`
# would unify features across both; `default-members` in the root manifest keeps
# the bare `cargo build`/`test` classical, and CI builds each variant separately.)
eframe = "0.32.3"
filesec-gui = { path = "../filesec-gui", features = ["pqc", "keyring", "passkey"] }
