[package]
name = "filesec-core"
description = "Core cryptography and the .fsec container format for FileSec."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Post-quantum opt-in. Wired but inert in the MVP (no PQC suite shipped yet);
# enabling it today is a no-op so the API surface stays stable for later phases.
pqc = []

[dependencies]
argon2 = "0.5.3"
blake3 = "1.8.5"
chacha20poly1305 = { version = "0.10.1", features = ["stream", "alloc"] }
ciborium = "0.2.2"
data-encoding = "2.11.0"
ed25519-dalek = "2.2.0"
fs-err = "3.3.0"
getrandom = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
subtle = "2.6.1"
thiserror = "2.0.18"
walkdir = "2.5.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
insta = "1.47.2"
proptest = "1.11.0"
