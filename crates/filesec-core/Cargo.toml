[package]
name = "filesec-core"
description = "Core cryptography and the .fsec container format for FileSec."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Post-quantum opt-in (Phase 5). Enables the additional algorithm suites:
#   * 0x0002 — AES-256-GCM (classical X25519/Ed25519, AES bulk cipher)
#   * 0x0101 — Hybrid X25519+ML-KEM-768 KEM and Ed25519+ML-DSA-65 signatures
# A build without this feature supports only the classical default suite 0x0001
# and cleanly rejects (UnsupportedSuite) containers that name 0x0002/0x0101.
pqc = ["dep:aes-gcm", "dep:ml-kem", "dep:ml-dsa"]

[dependencies]
argon2 = "0.5.3"
blake3 = "1.8.5"
chacha20poly1305 = { version = "0.10.1", features = ["stream", "alloc"] }
ciborium = "0.2.2"
data-encoding = "2.11.0"
ed25519-dalek = "2.2.0"
fs-err = "3.3.0"
getrandom = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
subtle = "2.6.1"
thiserror = "2.0.18"
walkdir = "2.5.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8.2", features = ["derive"] }

# Post-quantum suites (opt-in via the `pqc` feature). `default-features = false`
# plus the minimal feature set keeps these off the classical build entirely and
# avoids pulling getrandom 0.3/0.4 (we source all entropy through getrandom 0.2,
# using the seed/deterministic APIs of each crate). See the `pqc` feature above.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "stream"], optional = true }
ml-kem = { version = "0.3.2", default-features = false, features = ["alloc", "zeroize"], optional = true }
ml-dsa = { version = "0.1.0", default-features = false, features = ["alloc", "zeroize"], optional = true }

[dev-dependencies]
insta = "1.47.2"
proptest = "1.11.0"
# Construct synthetic passkey hmac outputs (Zeroizing) in keystore tests.
zeroize = { version = "1.8.2", features = ["derive"] }
