[package]
name = "filesec-gui"
description = "Native egui/eframe desktop app for FileSec secure file exchange."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "filesec"
path = "src/main.rs"

# cargo-dist builds the classical installer with OS-keychain auto-unlock and
# hardware-passkey unlock on (the release workflow passes the same
# `--features keyring,passkey`).
[package.metadata.dist]
features = ["keyring", "passkey"]

# `cargo deb` (Linux .deb). The release workflow builds the binary first with the
# right features, then runs `cargo deb --no-build` to package this already-built
# `target/release/filesec`.
[package.metadata.deb]
maintainer = "FileSec contributors"
copyright = "FileSec contributors"
extended-description = """\
FileSec is a native, offline desktop app for securely exchanging files between \
parties using public/private-key cryptography. This is the classical build \
(XChaCha20-Poly1305 / X25519 / Ed25519); the post-quantum build is the separate \
`filesec-pqc` package."""
section = "utils"
priority = "optional"
# `target/release/...` is remapped by cargo-deb to the real (workspace) target
# dir; other paths are relative to this crate's directory.
assets = [
    ["target/release/filesec", "usr/bin/", "755"],
    ["packaging/filesec.desktop", "usr/share/applications/", "644"],
    # Hicolor icon set so the .desktop's `Icon=filesec` resolves in app menus.
    ["assets/icon/icon-16.png", "usr/share/icons/hicolor/16x16/apps/filesec.png", "644"],
    ["assets/icon/icon-32.png", "usr/share/icons/hicolor/32x32/apps/filesec.png", "644"],
    ["assets/icon/icon-64.png", "usr/share/icons/hicolor/64x64/apps/filesec.png", "644"],
    ["assets/icon/icon-128.png", "usr/share/icons/hicolor/128x128/apps/filesec.png", "644"],
    ["assets/icon/icon-256.png", "usr/share/icons/hicolor/256x256/apps/filesec.png", "644"],
    ["assets/icon/icon-512.png", "usr/share/icons/hicolor/512x512/apps/filesec.png", "644"],
]

[features]
default = []
# Forward the core post-quantum opt-in.
pqc = ["filesec-core/pqc"]
# Opt-in hardware passkey unlock (FIDO2 `hmac-secret`). Pulls a USB-HID FIDO2
# client; kept optional so the default build stays dependency-light and the
# CI/sandbox build (which can't compile vendored hidapi or test real hardware)
# is unaffected. See src/passkey.rs.
passkey = ["dep:ctap-hid-fido2"]
# Opt-in "remember on this device" auto-unlock via the OS keychain (macOS
# Keychain / Windows Credential Manager / Linux Secret Service). Optional so the
# default build keeps the passphrase-only stance and pulls no secret-store
# dependency. The backend crate is target-gated below. See src/autounlock.rs.
keyring = ["dep:keyring"]
# Opt-in "mount the vault as a virtual drive" via a native filesystem driver.
# Linux/macOS use FUSE (fuser, MIT / MSRV 1.85), target-gated below so the
# default build pulls nothing and stays dependency-light. See src/mount.rs.
# Windows (Dokany) is a separate, stubbed backend pending a Windows build env;
# its dependency is intentionally not added until it can be compiled/verified.
#
# Real mounting: on Linux fuser uses its pure-Rust backend (no build-time
# system library; mounts via `fusermount` at runtime). On macOS fuser links
# libfuse, so a real macOS build needs FUSE-T (kext-less) or macFUSE installed
# at *build* time (the macOS release runner installs FUSE-T).
mount = ["dep:fuser"]
# Compile-only variant for a macOS host that has NO FUSE-T/macFUSE installed
# (e.g. CI lint jobs and local dev): turns on fuser's `macos-no-mount`, which
# compiles the backend but cannot actually mount on macOS. Use `mount` (not
# `mount-dev`) for any build that must really mount. No effect on Linux.
mount-dev = ["mount", "fuser/macos-no-mount"]

[dependencies]
directories = "6.0.0"
eframe = "0.32.3"
egui = "0.32.3"
egui_extras = "0.32.3"
filesec-core = { path = "../filesec-core" }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
walkdir = "2.5.0"
# Pinned to match filesec-core (Rust 1.86 MSRV); wipes passphrases held in UI state.
zeroize = "1.8.2"

# Hardware passkey backend (opt-in via the `passkey` feature). Pinned to 3.5.7:
# 3.5.8+ call `u*::is_multiple_of` (stabilized in Rust 1.87) in their hmac-secret
# code and so won't build on our 1.86 MSRV. 3.5.7 has the full hmac-secret API
# and uses `ring` for crypto, so getrandom stays 0.2. Vendors hidapi (C) and is
# compiled only when the feature is enabled.
ctap-hid-fido2 = { version = "=3.5.7", optional = true }

# OS-keychain backend (opt-in via the `keyring` feature). 3.6 declares a 1.75
# MSRV and target-gates every platform backend, so each OS pulls only its own:
# macOS gets `security-framework`, Windows `windows-sys`, Linux the D-Bus Secret
# Service (which drags in `zbus` — already required on Linux by rfd/directories,
# so it doesn't raise the Linux MSRV further; the macOS/Windows hosts never
# compile it). 4.x needs Rust 1.88, so it is held at 3.6 for the 1.86 MSRV.
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3.6"
optional = true
default-features = false
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3.6"
optional = true
default-features = false
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3.6"
optional = true
default-features = false
# Persistent Secret Service (GNOME Keyring / KWallet) over D-Bus, with the
# pure-Rust transport crypto (avoids an OpenSSL build dependency).
features = ["sync-secret-service", "crypto-rust"]

# FUSE backend for the `mount` feature (Linux + macOS). MIT, MSRV 1.85.
# `default-features = false` drops fuser's build-time `libfuse` link, so the
# crate compiles on a host that has no macFUSE/FUSE-T installed; the actual
# mount syscalls reach the installed driver at runtime. A real macOS mount needs
# FUSE-T (kext-less) or macFUSE present.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies.fuser]
version = "0.17"
optional = true
default-features = false

# Embeds the app icon into the Windows `filesec.exe` (see build.rs).
# `default-features = false` drops winresource's `toml` feature, leaving it
# dependency-free — no toml/winnow MSRV exposure; it declares no rust-version
# and builds on the 1.86 MSRV. The build script no-ops unless targeting Windows,
# so the macOS/Linux builds are unaffected. Installer-side icon: packaging/windows.
[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
