<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blue squircle background gradient -->
    <linearGradient id="bg" x1="160" y1="96" x2="864" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E9CFF"/>
      <stop offset="0.55" stop-color="#3A78F0"/>
      <stop offset="1" stop-color="#2552CC"/>
    </linearGradient>
    <!-- Soft gloss highlight over the top of the squircle -->
    <radialGradient id="gloss" cx="0.5" cy="0.06" r="0.9" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Document face gradient (white → cool white) -->
    <linearGradient id="doc" x1="512" y1="280" x2="512" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F0FF"/>
    </linearGradient>
    <!-- Keyhole vertical shading -->
    <linearGradient id="hole" x1="512" y1="452" x2="512" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E63D8"/>
      <stop offset="1" stop-color="#1E47B0"/>
    </linearGradient>
    <!-- Drop shadow for the document -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0E1F47" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="72" y="72" width="880" height="880" rx="208" fill="url(#bg)"/>
  <rect x="72" y="72" width="880" height="880" rx="208" fill="url(#gloss)"/>

  <!-- Foreground, scaled up ~8% about centre for better presence at small sizes -->
  <g transform="translate(-41 -41) scale(1.08)">
    <!-- Document with a folded top-right corner -->
    <g filter="url(#shadow)">
      <path d="M 322 310
               Q 322 280 352 280
               L 582 280
               L 702 400
               L 702 730
               Q 702 760 672 760
               L 352 760
               Q 322 760 322 730
               Z"
            fill="url(#doc)"/>
      <!-- Folded corner (underside of the page) -->
      <path d="M 582 280 L 702 400 L 582 400 Z" fill="#C9DAF7"/>
    </g>

    <!-- Keyhole punched through the page -->
    <circle cx="512" cy="500" r="48" fill="url(#hole)"/>
    <path d="M 494 512 L 530 512 L 542 600 L 482 600 Z" fill="url(#hole)"/>

    <!-- Document text lines (subtle, reinforce the 'file' read) -->
    <g fill="#CBDBF6">
      <rect x="420" y="648" width="184" height="18" rx="9"/>
      <rect x="420" y="694" width="132" height="18" rx="9"/>
    </g>
  </g>
</svg>
