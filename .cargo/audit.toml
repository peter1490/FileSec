# cargo-audit configuration.
#
# cargo-audit is the canonical RustSec advisory scanner; it runs in the
# "supply-chain" CI job alongside cargo-deny (which additionally gates licenses,
# bans, and sources). Both read the same RustSec database, so this ignore list
# MUST be kept in lockstep with the `[advisories] ignore` list in ../deny.toml —
# each entry there has the full justification. A summary is repeated here so this
# file is self-explanatory; see deny.toml for the reachability analysis and the
# condition under which each exception is dropped.
#
# By default cargo-audit fails on vulnerabilities and only warns on informational
# (unmaintained) advisories; every ID below is listed so neither tool blocks CI
# on these accepted, low-reachability transitive advisories in the UI toolkit's
# graph. A
# new advisory (any ID not listed) still fails the build. Owners and review-by
# dates live in deny.toml; scripts/check_advisory_exceptions.py enforces both the
# dates and this file's lockstep with deny.toml.

[advisories]
ignore = [
    # ttf-parser 0.25.1 — unmaintained, no patch; GPUI's Linux text stack and
    # usvg parse bundled/system fonts with it, never user content.
    "RUSTSEC-2026-0192",
    # quick-xml 0.39.4 — two DoS; patched only in >= 0.41 (major); build-time
    # only, inside the wayland-scanner proc-macro (bundled protocol XML).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # Maintenance-only: standalone D-Bus crates merged into zbus 6. GPUI's Linux
    # D-Bus stack still requires zbus 5; see the dated entries in deny.toml. No
    # vulnerability is suppressed by these exceptions.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # instant 0.1.13 — unmaintained timing shim in GPUI Base; no input parsing.
    "RUSTSEC-2024-0384",
    # paste 1.0.15 — unmaintained compile-time proc-macro (GPUI Component).
    "RUSTSEC-2024-0436",
    # rustybuzz 0.20.1 — unmaintained; inside usvg rendering GPUI's bundled SVG
    # icons, never user content.
    "RUSTSEC-2026-0206",
    # audit-only: owner: @peter1490; review-by: 2027-05-31; rustls-pemfile 2.2.0
    # is unmaintained and reachable only through GPUI Kit's asset-fetching HTTP
    # client (gpui-pre-reqwest), which is in Cargo.lock but in no shipped
    # target's build (cargo-deny, which resolves the shipped targets and
    # features, never encounters it). FileSec makes no HTTP requests.
    "RUSTSEC-2025-0134",
]
