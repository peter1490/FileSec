name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  # The release workflow calls this whole workflow for the tagged commit and
  # will not publish unless every job here passes (FS-14).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # One pinned toolchain for CI and releases (bump it in release.yml together).
  # A floating `stable` let new lints and compiler behavior change what a
  # given commit builds into.
  RUST_TOOLCHAIN: 1.97.0

# Supply-chain note: every third-party GitHub Action is pinned by commit SHA with
# the human-readable version in a trailing comment, so a moved or compromised tag
# cannot silently change what runs in CI. Bump the SHA and the comment together
# when upgrading an action. Installed cargo tools are likewise pinned by version.

jobs:
  # Classical (default) build + tests + lint on all three OSes, then the exact
  # shipped feature graph on all three. The bare cargo commands operate on the
  # default workspace members (filesec-core, filesec-gui), i.e. the
  # dependency-light classical path — filesec-pqc is excluded from those.
  test:
    timeout-minutes: 45
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned runner images (not *-latest) so a re-run builds on the same
        # baseline the commit was validated on.
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # eframe/winit + rfd need a few system libraries to build on Linux.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev \
            libudev-dev

      # Linux needs rustc >= 1.88 (rfd's portal backend; see the `msrv` job);
      # macOS/Windows build on the 1.86 MSRV (checked by the `msrv` job). The pinned RUST_TOOLCHAIN
      # satisfies all and the locked deps still apply. The action is pinned by
      # SHA, so the toolchain must be named explicitly.
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-07
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (classical)
        run: cargo clippy --all-targets --locked

      - name: Build (classical)
        run: cargo build --locked

      - name: Verify embedded Windows resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/verify_resources.ps1 -File target/debug/filesec.exe

      - name: Test (classical)
        run: cargo test --locked

      # The release ships a generated THIRD_PARTY_NOTICES.txt in every package;
      # make sure the generator keeps working for both binaries (FS-18).
      - name: Third-party notices
        if: runner.os == 'Linux'
        run: |
          for pkg in filesec-gui filesec-pqc; do
            python3 scripts/third_party_notices.py --package "$pkg" \
              --target x86_64-unknown-linux-gnu --out "target/notices/$pkg.txt"
            grep -q 'SIL OPEN FONT LICENSE' "target/notices/$pkg.txt"
          done

      # The shipped binaries enable pqc + keyring + passkey (+ net for
      # filesec-pqc). Test exactly that graph on every OS we ship for, not only
      # on macOS (FS-14).
      - name: Clippy (shipped features)
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Test (shipped features)
        run: cargo test --workspace --all-features --locked

  # Opt-in feature builds, exercised on a single OS to keep CI fast. These gate
  # the exact feature combinations that ship in the release binaries (see
  # .github/workflows/release.yml): the `filesec` binary is built with
  # pqc,keyring,passkey and the `filesec-pqc` binary additionally enables net.
  # Each shipped feature set gets a clippy/test pass here so users never receive a
  # combination CI did not compile. macOS carries the FIDO2/HID stack the passkey
  # feature needs; hardware-backed passkey tests still require a physical key and
  # stay #[ignore]d (see crates/filesec-gui/src/passkey.rs).
  features:
    timeout-minutes: 45
    name: features (release feature sets)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-07
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Clippy (pqc)
        run: cargo clippy -p filesec-core -p filesec-gui --all-targets --features pqc --locked

      - name: Test (pqc)
        run: cargo test -p filesec-core -p filesec-gui --features pqc --locked

      - name: Clippy (net)
        run: cargo clippy -p filesec-core -p filesec-gui --all-targets --features net --locked

      - name: Test (net)
        run: cargo test -p filesec-core -p filesec-gui --features net --locked

      - name: Clippy (keyring compile path)
        run: cargo clippy -p filesec-gui --all-targets --features keyring --locked

      - name: Clippy (passkey compile path)
        run: cargo clippy -p filesec-gui --all-targets --features passkey --locked

      # The exact feature set of the shipped `filesec` binary.
      - name: "Clippy (filesec release features: pqc,keyring,passkey)"
        run: cargo clippy -p filesec-gui --all-targets --features "pqc,keyring,passkey" --locked

      - name: Clippy (post-quantum variant binary)
        run: cargo clippy -p filesec-pqc --all-targets --locked

      - name: Build (post-quantum variant binary)
        run: cargo build -p filesec-pqc --locked

      - name: Test (all shipped features together)
        run: cargo test --workspace --all-features --locked

  # The declared minimum toolchain (`rust-version = "1.86"` in Cargo.toml). The
  # other jobs build with the newer pinned toolchain, which cannot catch a
  # dependency or language feature that silently raised the real minimum.
  # macOS and Windows build on 1.86; Linux needs 1.88 because rfd's Linux
  # portal backend relies on `Default` for raw pointers (stabilized in 1.88; its
  # zbus dependency alone needs 1.87). Documented in README.md. Covers the
  # shipped feature graph.
  msrv:
    timeout-minutes: 45
    name: msrv (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            toolchain: 1.86.0
          - os: windows-2025
            toolchain: 1.86.0
          - os: ubuntu-24.04
            toolchain: 1.88.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev \
            libudev-dev

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-07
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0
        with:
          key: msrv-${{ matrix.toolchain }}

      - name: Check (declared minimum, all shipped features)
        run: cargo check --workspace --all-features --all-targets --locked

  # Supply-chain gate. Blocks known-vulnerable/yanked dependencies, disallowed
  # licenses, and any crate sourced from outside crates.io. cargo-deny is the
  # comprehensive gate (advisories + licenses + bans + sources, config in
  # deny.toml); cargo-audit is the canonical RustSec scanner run as a cross-check
  # (config in .cargo/audit.toml). Both tools are pinned by version, and their
  # accepted-advisory ignore lists are kept in lockstep. Neither reads the
  # workspace's MSRV, so they build with the pinned CI toolchain.
  supply-chain:
    timeout-minutes: 30
    name: supply-chain (audit, deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-07
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Install pinned supply-chain tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked

      # Accepted advisories must name an owner and a review-by date that has not
      # passed, and deny.toml and .cargo/audit.toml must list the same IDs.
      - name: Advisory exceptions are owned, dated, and in sync
        run: python3 scripts/check_advisory_exceptions.py

      # Fails the build on any advisory not explicitly accepted in deny.toml, on a
      # non-permissive license, or on a non-crates.io source.
      - name: cargo deny
        run: cargo deny --all-features check

      # Canonical RustSec cross-check against Cargo.lock.
      - name: cargo audit
        run: cargo audit --deny unsound

      # Report-only: the same scan run outside the repository, so no ignore list
      # applies, published to the job summary. Keeps the accepted exceptions
      # visible — a green gate is not "no known advisories".
      - name: cargo audit (unsuppressed report)
        run: |
          cd "$RUNNER_TEMP"
          cargo audit --file "$GITHUB_WORKSPACE/Cargo.lock" --json > unsuppressed.json || true
          python3 "$GITHUB_WORKSPACE/scripts/advisory_report.py" unsuppressed.json >> "$GITHUB_STEP_SUMMARY"

  # Validate the GitHub Actions workflows themselves: action-reference format,
  # expression syntax, matrix/needs/permissions consistency, and the signing-gate
  # conditions. actionlint is downloaded at a pinned version and verified against
  # its published SHA-256 before use. Shellcheck integration is disabled (the
  # release scripts intentionally rely on word-splitting `$BUILD_ARGS`); the
  # structural workflow checks are the ones that matter here.
  workflows:
    name: lint workflows (actionlint)
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run actionlint
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -shellcheck=
