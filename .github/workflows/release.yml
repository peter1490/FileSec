name: Release

# Authoritative release pipeline. On a version tag it builds BOTH variants —
# `filesec` (the standard build: post-quantum suites available, networking off)
# and `filesec-pqc` (the same app plus direct peer-to-peer network transfer) —
# for macOS, Windows and Linux, packages each into native installers
# (.dmg / .msi + NSIS / .deb) plus a portable archive, code-signs and notarizes
# where credentials are configured, generates a per-variant SBOM, and publishes
# everything with a SHA256SUMS file and SLSA build-provenance attestations to a
# GitHub Release. Both builds compile the post-quantum suites in; new identities
# are classical by default in both. The matrix key `classical` is the standard
# (no-networking) build and `pqc` is the networking build — kept as keys only to
# avoid churning artifact names.
#
# Each variant is built in its own `cargo build -p <package>` invocation so the
# networking code is never unified into the standard binary. Signing and
# notarization are mandatory for official version tags on the upstream repo.
# Forks and manual development runs may still build unsigned artifacts, but they
# do not publish stable upstream releases (the publish job is gated on the tag
# and the upstream repository). See RELEASE.md for the secrets.
#
# Supply-chain note: every third-party GitHub Action is pinned by commit SHA with
# the human-readable version in a trailing comment, and every release-time cargo
# tool (cargo-wix, cargo-deb, cargo-sbom) is pinned by version. Bump the SHA/
# version and its comment together when upgrading.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; the publish job widens its own grant.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------ macOS
  macos:
    name: macOS (${{ matrix.variant }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [classical, pqc]
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER: ${{ secrets.AC_API_ISSUER }}
      RELEASE_SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/') && github.repository == 'peter1490/FileSec' && '1' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-07
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Set variant parameters
        run: |
          if [ "${{ matrix.variant }}" = "pqc" ]; then
            echo "BUILD_ARGS=-p filesec-pqc"                          >> "$GITHUB_ENV"
            echo "BIN=filesec-pqc"                                    >> "$GITHUB_ENV"
            echo "APP_NAME=FileSec"                                   >> "$GITHUB_ENV"
            echo "BUNDLE_ID=dev.FileSec.FileSec.pqc"                  >> "$GITHUB_ENV"
          else
            echo "BUILD_ARGS=-p filesec-gui --bin filesec --features pqc,keyring,passkey" >> "$GITHUB_ENV"
            echo "BIN=filesec"                                        >> "$GITHUB_ENV"
            echo "APP_NAME=FileSec"                                   >> "$GITHUB_ENV"
            echo "BUNDLE_ID=dev.FileSec.FileSec"                      >> "$GITHUB_ENV"
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build (aarch64 + x86_64 → universal)
        run: |
          cargo build --locked --release --target aarch64-apple-darwin $BUILD_ARGS
          cargo build --locked --release --target x86_64-apple-darwin $BUILD_ARGS
          mkdir -p dist
          lipo -create -output "dist/$BIN" \
            "target/aarch64-apple-darwin/release/$BIN" \
            "target/x86_64-apple-darwin/release/$BIN"

      - name: Import signing certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KP="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KP" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Prepare notarization API key
        if: env.AC_API_KEY_BASE64 != ''
        run: |
          echo "$AC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/ac_api_key.p8"
          echo "AC_API_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8" >> "$GITHUB_ENV"

      - name: Require macOS signing for official tags
        if: env.RELEASE_SIGNING_REQUIRED == '1'
        run: |
          test -n "$MACOS_CERT_P12_BASE64"
          test -n "$MACOS_CERT_PASSWORD"
          test -n "$MACOS_SIGN_IDENTITY"
          test -n "$AC_API_KEY_BASE64"
          test -n "$AC_API_KEY_ID"
          test -n "$AC_API_ISSUER"

      - name: Package archive + signed/notarized .dmg
        run: |
          BASE="$BIN-$VERSION-universal-apple-darwin"
          ( cd dist && tar -czf "$BASE.tar.gz" "$BIN" )
          BIN_PATH="dist/$BIN" OUT_DMG="dist/$BASE.dmg" \
            bash packaging/macos/package_macos.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.variant }}
          path: |
            dist/*.tar.gz
            dist/*.dmg

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [classical, pqc]
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      RELEASE_SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/') && github.repository == 'peter1490/FileSec' && '1' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-07
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Set variant parameters
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "pqc" ]; then
            echo "BUILD_ARGS=-p filesec-pqc"  >> "$GITHUB_ENV"
            echo "BIN=filesec-pqc"            >> "$GITHUB_ENV"
            echo "PKG=filesec-pqc"            >> "$GITHUB_ENV"
            echo "APP_NAME=FileSec"           >> "$GITHUB_ENV"
            echo "REG_KEY=FileSec-pqc"        >> "$GITHUB_ENV"
          else
            echo "BUILD_ARGS=-p filesec-gui --bin filesec --features pqc,keyring,passkey" >> "$GITHUB_ENV"
            echo "BIN=filesec"                >> "$GITHUB_ENV"
            echo "PKG=filesec-gui"            >> "$GITHUB_ENV"
            echo "APP_NAME=FileSec"           >> "$GITHUB_ENV"
            echo "REG_KEY=FileSec"            >> "$GITHUB_ENV"
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: cargo build --locked --release $BUILD_ARGS

      - name: Require Windows signing for official tags
        if: env.RELEASE_SIGNING_REQUIRED == '1'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            throw "Official tag releases require WINDOWS_CERT_BASE64 and WINDOWS_CERT_PASSWORD."
          }

      - name: Sign executable
        shell: pwsh
        run: ./packaging/windows/sign.ps1 -File "target/release/$env:BIN.exe"

      - name: Portable .zip
        shell: bash
        run: |
          mkdir -p dist
          ( cd target/release && 7z a "$GITHUB_WORKSPACE/dist/$BIN-$VERSION-x86_64-pc-windows-msvc.zip" "$BIN.exe" )

      - name: NSIS installer
        shell: bash
        run: |
          OUT="dist/$BIN-$VERSION-x86_64-windows-setup.exe"
          # makensis cd's to the script's directory (packaging/windows) before
          # resolving relative paths, so SRC_EXE/OUT_FILE would be looked up
          # under packaging/windows/ and not be found. -NOCD keeps the working
          # directory at the repo root, where target/release/ and dist/ live.
          # Backslashes in SRC_EXE: NSIS's File command wants the native sep.
          makensis -NOCD -DAPP_NAME="$APP_NAME" -DAPP_EXE="$BIN.exe" -DAPP_VERSION="$VERSION" \
            -DSRC_EXE="target\\release\\$BIN.exe" -DOUT_FILE="$OUT" -DREG_KEY="$REG_KEY" \
            packaging/windows/filesec.nsi

      # MSI via cargo-wix, built from the committed WiX source
      # (crates/<pkg>/wix/main.wxs) so the installer is deterministic and
      # reviewable — no per-run `wix init` regeneration that could drift. The
      # windows-latest image ships the WiX v3 toolset cargo-wix drives. This is a
      # required release artifact for official tags (no continue-on-error): a
      # broken MSI now fails the release rather than silently shipping without it.
      - name: MSI installer
        shell: bash
        run: |
          cargo install cargo-wix --version 0.3.9 --locked
          cargo wix -p "$PKG" --no-build --nocapture \
            --output "dist/$BIN-$VERSION-x86_64.msi"

      - name: Sign installers
        shell: pwsh
        run: |
          $setup = "dist/$env:BIN-$env:VERSION-x86_64-windows-setup.exe"
          if (Test-Path $setup) { ./packaging/windows/sign.ps1 -File $setup }
          $msi = "dist/$env:BIN-$env:VERSION-x86_64.msi"
          if (Test-Path $msi) { ./packaging/windows/sign.ps1 -File $msi }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.variant }}
          path: dist/*

  # ------------------------------------------------------------------ Linux
  linux:
    name: Linux (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [classical, pqc]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev \
            libudev-dev
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-07
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Set variant parameters
        run: |
          if [ "${{ matrix.variant }}" = "pqc" ]; then
            echo "BUILD_ARGS=-p filesec-pqc"  >> "$GITHUB_ENV"
            echo "BIN=filesec-pqc"            >> "$GITHUB_ENV"
            echo "PKG=filesec-pqc"            >> "$GITHUB_ENV"
          else
            echo "BUILD_ARGS=-p filesec-gui --bin filesec --features pqc,keyring,passkey" >> "$GITHUB_ENV"
            echo "BIN=filesec"                >> "$GITHUB_ENV"
            echo "PKG=filesec-gui"            >> "$GITHUB_ENV"
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --locked --release $BUILD_ARGS

      - name: Portable tarball
        run: |
          mkdir -p dist
          ( cd target/release && tar -czf "$GITHUB_WORKSPACE/dist/$BIN-$VERSION-x86_64-unknown-linux-gnu.tar.gz" "$BIN" )

      - name: Build .deb
        run: |
          cargo install cargo-deb --version 3.7.0 --locked
          cargo deb -p "$PKG" --no-build
          cp target/debian/*.deb dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.variant }}
          path: dist/*

  # -------------------------------------------------------------------- SBOM
  # One CycloneDX/SPDX software bill of materials per shipped variant, from the
  # resolved dependency graph. cargo-sbom only reads `cargo metadata`, so it needs
  # the toolchain but no system build libraries. Pinned by version; required for
  # publish so a release always carries its SBOMs.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-07
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0

      - name: Generate per-variant SBOMs (SPDX 2.3 JSON)
        run: |
          cargo install cargo-sbom --version 0.10.0 --locked
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cargo sbom --cargo-package filesec-gui > "dist/filesec-$VERSION.spdx.json"
          cargo sbom --cargo-package filesec-pqc > "dist/filesec-pqc-$VERSION.spdx.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: dist/*.spdx.json

  # ----------------------------------------------------------------- Publish
  publish:
    name: Publish GitHub Release
    needs: [macos, windows, linux, sbom]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'peter1490/FileSec'
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC token for build-provenance attestation (Sigstore)
      attestations: write # write the provenance to the attestations store
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Collect artifacts and compute checksums
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' \
            -o -name '*.deb' -o -name '*.msi' -o -name '*-setup.exe' \
            -o -name '*.spdx.json' \
          \) -exec cp -n {} release/ \;
          # Checksum every collected artifact. Write SHA256SUMS outside release/
          # first so the glob never tries to hash the file being created, then
          # move it in alongside the artifacts it covers.
          ( cd release && sha256sum * > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS )
          echo "----- SHA256SUMS -----"
          cat release/SHA256SUMS

      # SLSA build-provenance attestation for every published file, including the
      # SHA256SUMS manifest itself (so consumers can verify the checksum list is
      # authentic, then verify each download against it) and the SBOMs. Verify
      # with: gh attestation verify <file> --repo peter1490/FileSec
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/*

      - name: Create release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
